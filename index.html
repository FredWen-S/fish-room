<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼的小房间</title>
<style>
  :root {
    --bg-a: #fde9da; --bg-b: #f3cdb9;
    --card: rgba(255, 251, 245, 0.86); --card-line: rgba(120, 90, 70, 0.14);
    --ink: #3b3446; --ink-soft: #7a6f80; --accent: #4f6df5;
    --shadow: 0 10px 30px rgba(90, 60, 50, 0.14);
  }
  body.night {
    --bg-a: #26305a; --bg-b: #0f1429;
    --card: rgba(28, 33, 60, 0.82); --card-line: rgba(200, 210, 255, 0.12);
    --ink: #e8e8f6; --ink-soft: #a3a6c6; --accent: #8ea2ff;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    color: var(--ink);
    background: radial-gradient(120% 90% at 30% 35%, var(--bg-a), var(--bg-b));
    transition: background 2s;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .card {
    position: fixed; background: var(--card); border: 1px solid var(--card-line);
    border-radius: 18px; box-shadow: var(--shadow); backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }

  /* 状态卡 */
  .status { top: 16px; left: 16px; width: min(340px, calc(100% - 32px)); padding: 16px 18px 14px; }
  .status h1 { margin: 0 0 10px; font-size: 17px; letter-spacing: .5px; display: flex; align-items: center; gap: 8px; }
  .status h1 small { font-size: 12px; font-weight: 400; color: var(--ink-soft); }
  .now { display: flex; align-items: center; gap: 10px; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 4px 11px 4px 9px; border-radius: 999px;
    font-size: 13px; font-weight: 600; color: #fff; background: var(--state, #7bbf8e);
    transition: background .4s; white-space: nowrap;
  }
  .chip .pulse { width: 8px; height: 8px; border-radius: 50%; background: #fff; animation: pulse 1.6s infinite; }
  @keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
  .detail { font-size: 14px; line-height: 1.45; }
  .meta { margin-top: 8px; font-size: 12px; color: var(--ink-soft); display: flex; gap: 10px; flex-wrap: wrap; }
  .demo { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--card-line); display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .demo span { font-size: 12px; color: var(--ink-soft); margin-right: 2px; }
  .demo button {
    font: inherit; font-size: 12px; padding: 4px 9px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--card-line); background: transparent; color: var(--ink);
  }
  .demo button:hover { border-color: var(--accent); color: var(--accent); }
  .demo + .demo { margin-top: 8px; padding-top: 0; border-top: 0; }
  .demo .tip { flex-basis: 100%; margin-top: 2px; font-size: 11px; }

  /* 动态 */
  .feed { top: 16px; right: 16px; width: 310px; bottom: 88px; padding: 14px 6px 10px 16px; display: flex; flex-direction: column; }
  .feed h2 { margin: 0 0 8px; font-size: 14px; display: flex; justify-content: space-between; padding-right: 10px; }
  .feed h2 span { font-weight: 400; color: var(--ink-soft); font-size: 12px; }
  #feed { list-style: none; margin: 0; padding: 0 10px 0 0; overflow-y: auto; flex: 1; }
  #feed li { font-size: 13px; line-height: 1.45; padding: 7px 0; border-bottom: 1px solid var(--card-line); display: grid; grid-template-columns: 42px 1fr; gap: 4px; animation: slide .35s ease-out; }
  #feed li time { color: var(--ink-soft); font-size: 11px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  #feed li .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
  #feed li.msg_in b, #feed li.msg_out b { font-weight: 600; }
  #feed li.log { color: var(--ink-soft); }
  #feed li .txt { word-break: break-word; }
  @keyframes slide { from { opacity: 0; transform: translateY(-6px); } }

  /* 底部 */
  .chatbar { left: 50%; transform: translateX(-50%); bottom: 16px; width: min(560px, calc(100% - 32px)); padding: 6px; display: flex; gap: 6px; }
  .chatbar input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; padding: 10px 14px; border: 0; outline: 0;
    background: transparent; color: var(--ink);
  }
  .chatbar input::placeholder { color: var(--ink-soft); }
  .chatbar button {
    font: inherit; font-size: 14px; font-weight: 600; padding: 0 18px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .chatbar button:disabled { opacity: .5; cursor: wait; }
  .stats { position: fixed; left: 18px; bottom: 26px; font-size: 12px; color: var(--ink-soft); max-width: calc(50% - 300px); }

  /* 头顶气泡 */
  .bubble {
    position: fixed; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: none;
    max-width: 270px; padding: 9px 13px; border-radius: 14px; font-size: 14px; line-height: 1.5;
    background: #fff; color: #333; box-shadow: 0 6px 18px rgba(40, 30, 60, .18);
    transition: opacity .3s; white-space: pre-wrap; word-break: break-word;
  }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  .bubble.hidden { opacity: 0; }
  .bubble .dots i { display: inline-block; width: 6px; height: 6px; margin: 0 2px; border-radius: 50%; background: #9aa3c7; animation: hop 1s infinite; }
  .bubble .dots i:nth-child(2) { animation-delay: .15s; } .bubble .dots i:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 30% { transform: translateY(-5px); background: var(--accent); } }

  .banner { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: #2b2b3a; color: #fff; font-size: 13px; z-index: 5; }
  .banner.hidden { display: none; }

  @media (max-width: 860px) {
    .feed { top: auto; left: 16px; right: 16px; width: auto; bottom: 76px; height: 27vh; }
    .stats { display: none; }
    .status { padding: 12px 14px; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="bubble" class="bubble hidden"></div>

<section class="card status">
  <h1>🐳 大肥鱼的小房间 <small id="clock"></small></h1>
  <div class="now">
    <span class="chip" id="chip"><span class="pulse"></span><span id="chipText">闲逛</span></span>
    <span class="detail" id="detail">在房间里闲逛</span>
  </div>
  <div class="meta"><span id="since">刚刚开始</span><span id="source"></span><span id="act">动作：站着</span></div>
  <div class="demo">
    <span>演示</span>
    <button data-demo="working">工作</button>
    <button data-demo="qq">来条 QQ 消息</button>
    <button data-demo="resting">休息</button>
    <button data-demo="idle">闲逛</button>
    <button data-demo="error">出错</button>
  </div>
  <div class="demo">
    <span>互动</span>
    <button data-play="snack">喂小鱼干</button>
    <button data-play="dance">跳个舞</button>
    <button data-play="twirl">转个圈</button>
    <span class="tip">还可以摸头、戳她、把她拎起来</span>
  </div>
</section>

<aside class="card feed">
  <h2>它在干什么 <span id="conn">连接中…</span></h2>
  <ol id="feed"></ol>
</aside>

<div class="stats" id="stats"></div>
<form class="card chatbar" id="chat">
  <input id="msg" placeholder="和大肥鱼说点什么…" autocomplete="off" maxlength="2000">
  <button id="send">发送</button>
</form>
<div class="banner hidden" id="banner"></div>

<script type="module">

const STATES = {

// ------------------------------------------------------------------ 渲染器与相机

camera.lookAt(-0.3, 1.5, -0.3);

function resize() {
  const w = innerWidth, h = innerHeight, aspect = w / h;
  renderer.setSize(w, h, false);
  const wide = w > 860;
  const view = Math.max(6.3, 8.4 / aspect);
  const offsetX = wide ? view * aspect * 0.12 : 0;
  const offsetY = wide ? -0.3 : -view * 0.28;
  camera.left = -view * aspect + offsetX; camera.right = view * aspect + offsetX;
  camera.top = view + offsetY; camera.bottom = -view + offsetY;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

const mat = (color, extra = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.85, metalness: 0, ...extra });

  const mesh = shade(new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material instanceof THREE.Material ? material : mat(material)));
  mesh.position.set(x, y + h / 2, z); parent.add(mesh); return mesh;
}
function cyl(rt, rb, h, material, x, y, z, seg = 24) {
  const mesh = shade(new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), material instanceof THREE.Material ? material : mat(material)));
  mesh.position.set(x, y + h / 2, z); scene.add(mesh); return mesh;
}
function blob(r, color, sx, sy, sz, x, y, z, parent = scene, material) {
  const mesh = shade(new THREE.Mesh(new THREE.SphereGeometry(r, 28, 20), material || mat(color)));
  mesh.scale.set(sx, sy, sz); mesh.position.set(x, y, z); parent.add(mesh); return mesh;
}
function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 4;
  return { tex, ctx, canvas: c };
}
function wrapText(ctx, text, maxWidth) {
  const lines = []; let line = '';
  for (const ch of String(text)) {
    if (ch === '\n') { lines.push(line); line = ''; continue; }
    if (ctx.measureText(line + ch).width > maxWidth && line) { lines.push(line); line = ch; } else line += ch;
  }
  lines.push(line); return lines;
}
const lerpAngle = (a, b, t) => a + ((((b - a + Math.PI) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2) - Math.PI) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const hhmm = (ts) => new Date(ts * 1000).toTimeString().slice(0, 5);

// ------------------------------------------------------------------ 房间
const floorTex = canvasTexture(512, 512, (ctx, w, h) => {
  const tones = ['#d9a878', '#d29f6f', '#dcae80', '#cf9a69'];
  for (let row = 0; row < 8; row++) {
    let x = row % 2 ? -90 : 0;
    while (x < w) {
      const len = rand(150, 260);
      ctx.fillStyle = pick(tones); ctx.fillRect(x, row * 64, len, 64);
      ctx.fillStyle = 'rgba(90,50,20,.18)'; ctx.fillRect(x, row * 64, 2, 64);
      x += len;
    }
    ctx.fillStyle = 'rgba(90,50,20,.22)'; ctx.fillRect(0, row * 64, w, 2);
  }
});
floorTex.tex.wrapS = floorTex.tex.wrapT = THREE.RepeatWrapping; floorTex.tex.repeat.set(2, 2);
box(10, 0.3, 10, mat('#ffffff', { map: floorTex.tex }), 0, -0.3, 0);
box(0.3, 5.2, 10.3, '#f4e3cf', -5.15, -0.3, -0.15);   // 左墙
box(10.3, 5.2, 0.3, '#f7ead9', -0.15, -0.3, -5.15);   // 后墙
box(0.06, 1.25, 10, '#b9cfc0', -4.99, 0, 0);          // 护墙板
box(10, 1.25, 0.06, '#c3d6c8', 0, 0, -4.99);
box(0.1, 0.08, 10, '#fdf8f1', -4.96, 1.25, 0);
box(10, 0.08, 0.1, '#fdf8f1', 0, 1.25, -4.96);

// 窗户（左墙）
const sky = canvasTexture(256, 210, () => {});
const skyPlane = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 1.8), new THREE.MeshBasicMaterial({ map: sky.tex, toneMapped: false }));
skyPlane.rotation.y = Math.PI / 2; skyPlane.position.set(-4.965, 2.65, -2.0); scene.add(skyPlane);
const frameColor = '#fffaf2';
box(0.14, 0.12, 2.42, frameColor, -4.93, 3.55, -2.0); box(0.14, 0.12, 2.42, frameColor, -4.93, 1.63, -2.0);
box(0.14, 1.92, 0.12, frameColor, -4.93, 1.69, -3.15); box(0.14, 1.92, 0.12, frameColor, -4.93, 1.69, -0.85);
box(0.1, 1.8, 0.06, frameColor, -4.94, 1.75, -2.0); box(0.1, 0.06, 2.2, frameColor, -4.94, 2.62, -2.0);
box(0.42, 0.07, 2.7, frameColor, -4.82, 1.58, -2.0);
box(0.08, 2.5, 0.55, '#e98f7c', -4.88, 1.3, -3.55); box(0.08, 2.5, 0.55, '#e98f7c', -4.88, 1.3, -0.45);
box(0.1, 0.06, 3.4, '#9b7a5a', -4.9, 3.85, -2.0);
const pot1 = cyl(0.13, 0.1, 0.18, '#d7775c', -4.75, 1.65, -1.3);
blob(0.16, '#6aa36f', 1, 0.9, 1, -4.75, 1.98, -1.3);

// 书架（后墙）
const wood = '#b98457', woodDark = '#9c6a43';
box(1.8, 2.6, 0.06, woodDark, -2.4, 0, -4.95);
box(0.08, 2.6, 0.55, wood, -3.26, 0, -4.7); box(0.08, 2.6, 0.55, wood, -1.54, 0, -4.7);
const bookColors = ['#e8735a', '#f2b84b', '#5f8fd8', '#7cbf8e', '#a37ad6', '#f29fb5', '#4fb3b0', '#efe1c6'];
[0.02, 0.66, 1.3, 1.94, 2.55].forEach((y, row) => {
  box(1.74, 0.06, 0.55, wood, -2.4, y, -4.7);
  if (row === 4) return;
  let x = -3.18;
  while (x < -1.7) {
    const bw = rand(0.09, 0.17), bh = rand(0.34, 0.52);
    if (x + bw > -1.62) break;
    const book = box(bw, bh, rand(0.32, 0.42), pick(bookColors), x + bw / 2, y + 0.06, -4.72);
    if (Math.random() < 0.12) { book.rotation.z = -0.18; x += 0.05; }
    x += bw + 0.012;
  }
});
const globe = blob(0.2, '#7fc7e8', 1, 1, 1, -2.0, 2.82, -4.7, scene, mat('#7fc7e8', { roughness: 0.4 }));
cyl(0.08, 0.12, 0.06, woodDark, -2.0, 2.61, -4.7);

// 海报
const poster = canvasTexture(256, 200, (ctx, w, h) => {
  const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#bfe6f5'); g.addColorStop(1, '#4f8fd0');
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
  ctx.fillStyle = '#ffffff99';
  for (let i = 0; i < 3; i++) { ctx.beginPath(); for (let x = 0; x <= w; x += 8) ctx.lineTo(x, 120 + i * 26 + Math.sin(x / 22 + i) * 6); ctx.lineTo(w, h); ctx.lineTo(0, h); ctx.fill(); }
  ctx.fillStyle = '#3f5fe0'; ctx.beginPath(); ctx.ellipse(128, 86, 52, 30, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.moveTo(78, 86); ctx.lineTo(48, 66); ctx.lineTo(56, 104); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(150, 80, 5, 0, 7); ctx.fill();
  ctx.font = 'bold 22px "Microsoft YaHei", sans-serif'; ctx.fillStyle = '#fff'; ctx.fillText('去大海', 18, 34);
});
box(1.36, 1.06, 0.05, '#fffaf2', -0.1, 2.75, -4.98);
const posterMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.24, 0.96), mat('#fff', { map: poster.tex }));
posterMesh.position.set(-0.1, 3.28, -4.945); scene.add(posterMesh);

// 墙上的钟
const clockTex = canvasTexture(256, 256, () => {});
const clockRim = new THREE.Mesh(new THREE.CylinderGeometry(0.48, 0.48, 0.08, 40), mat('#e98f7c'));
clockRim.rotation.x = Math.PI / 2; clockRim.position.set(3.7, 3.45, -4.96); scene.add(clockRim);
const clockFace = new THREE.Mesh(new THREE.CircleGeometry(0.42, 40), new THREE.MeshBasicMaterial({ map: clockTex.tex }));
clockFace.position.set(3.7, 3.45, -4.91); scene.add(clockFace);
function drawClock() {
  const { ctx } = clockTex, now = new Date();
  ctx.fillStyle = '#fffaf2'; ctx.fillRect(0, 0, 256, 256);
  ctx.fillStyle = '#3b3446';
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; ctx.beginPath(); ctx.arc(128 + Math.sin(a) * 100, 128 - Math.cos(a) * 100, i % 3 ? 4 : 7, 0, 7); ctx.fill(); }
  const hand = (angle, len, width, color) => { ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(128, 128); ctx.lineTo(128 + Math.sin(angle) * len, 128 - Math.cos(angle) * len); ctx.stroke(); };
  const h = now.getHours() % 12 + now.getMinutes() / 60, m = now.getMinutes() + now.getSeconds() / 60;
  hand(h / 12 * Math.PI * 2, 55, 10, '#3b3446'); hand(m / 60 * Math.PI * 2, 82, 6, '#3b3446');
  hand(now.getSeconds() / 60 * Math.PI * 2, 88, 2, '#e8735a');
  clockTex.tex.needsUpdate = true;
}

// 书桌、电脑、凳子
box(2.8, 0.1, 1.25, wood, 1.4, 0.95, -4.25);
[[0.1, -3.7], [2.7, -3.7], [0.1, -4.8], [2.7, -4.8]].forEach(([x, z]) => box(0.1, 0.95, 0.1, woodDark, x, 0, z));
box(0.8, 0.45, 1.1, '#c99a6c', 2.25, 0.5, -4.25);
box(0.22, 0.05, 0.04, '#fffaf2', 2.25, 0.7, -3.68);
box(0.5, 0.04, 0.3, '#3a3a48', 1.4, 1.05, -4.55);

box(1.52, 0.97, 0.07, '#2c2c38', 1.4, 1.36, -4.62);
const screen = canvasTexture(512, 320, () => {});
const screenMesh = new THREE.Mesh(new THREE.PlaneGeometry(1.4, 0.86), new THREE.MeshBasicMaterial({ map: screen.tex, toneMapped: false }));
screenMesh.position.set(1.4, 1.845, -4.58); scene.add(screenMesh);
const screenGlow = new THREE.PointLight('#9fb6ff', 0, 3.2); screenGlow.position.set(1.4, 1.8, -4.1); scene.add(screenGlow);
box(0.95, 0.04, 0.32, '#ece6dc', 1.3, 1.05, -3.95);
box(0.14, 0.04, 0.2, '#ece6dc', 2.05, 1.05, -3.95);
cyl(0.1, 0.09, 0.2, '#f2b84b', 2.5, 1.05, -4.0);
box(0.25, 0.01, 0.25, '#ffe27a', 0.45, 1.05, -3.95).rotation.y = 0.3;

// 床
box(1.9, 0.38, 3.0, wood, -3.95, 0, 2.0);
box(1.9, 1.15, 0.12, woodDark, -3.95, 0, 0.5);
box(1.8, 0.26, 2.85, '#f8f3ea', -3.95, 0.38, 2.05);
const pillow = blob(0.5, '#ffffff', 1.25, 0.28, 0.55, -3.95, 0.74, 0.95);
box(1.86, 0.09, 1.75, '#8fb0f0', -3.95, 0.6, 2.6);
box(1.88, 0.03, 0.12, '#ffffff', -3.95, 0.69, 1.78);

// 落地灯
cyl(0.3, 0.32, 0.05, '#3a3a48', -4.35, 0, -0.05);
cyl(0.03, 0.03, 1.8, '#3a3a48', -4.35, 0.05, -0.05);
const shadeMat = mat('#fff1d6', { emissive: '#ffcf86', emissiveIntensity: 0 });
const lampShade = cyl(0.22, 0.38, 0.45, shadeMat, -4.35, 1.75, -0.05);
lampShade.castShadow = false;
const lampLight = new THREE.PointLight('#ffc477', 0, 8, 1.4); lampLight.position.set(-4.35, 1.85, -0.05); scene.add(lampLight);

// 地毯、懒人沙发、植物
cyl(2.15, 2.15, 0.03, '#f0c4a8', 0.6, 0, 1.3, 48).castShadow = false;

    ctx.fillStyle = '#3a1f2b'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ff8a7a'; ctx.font = '700 40px "Microsoft YaHei", sans-serif'; ctx.fillText('⚠ 出错了', 28, 40);
    ctx.fillStyle = '#f3d6d6'; ctx.font = '19px "Microsoft YaHei", sans-serif';
    wrapText(ctx, room.detail, 450).slice(0, 5).forEach((line, i) => ctx.fillText(line, 30, 110 + i * 28));
    screenGlow.intensity = Math.sin(t * 6) > 0 ? 0.9 : 0.3;
  } else if (s === 'idle') {
    const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, '#1d3a6e'); g.addColorStop(1, '#3d76b8');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    const fx = (t * 60) % (w + 120) - 60, fy = 160 + Math.sin(t * 2) * 30;
    ctx.fillStyle = '#ffffffcc'; ctx.beginPath(); ctx.ellipse(fx, fy, 30, 18, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx - 26, fy); ctx.lineTo(fx - 48, fy - 14); ctx.lineTo(fx - 48, fy + 14); ctx.fill();
    ctx.fillStyle = '#1d3a6e'; ctx.beginPath(); ctx.arc(fx + 14, fy - 4, 3.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffffaa'; ctx.font = '600 44px "Microsoft YaHei", sans-serif'; ctx.fillText(new Date().toTimeString().slice(0, 5), 28, 24);
    ctx.font = '18px "Microsoft YaHei", sans-serif'; ctx.fillText('大肥鱼的电脑 · 待机中', 30, 80);
    screenGlow.intensity = 0.4;
  } else if (s === 'thinking' || s === 'replying') {
    ctx.fillStyle = '#f6f7fb'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#4f6df5'; ctx.fillRect(0, 0, w, 44);
    ctx.fillStyle = '#fff'; ctx.font = '600 20px "Microsoft YaHei", sans-serif';
    const who = screenState.lastIn?.who || '有人';
    ctx.fillText(`💬 ${who}${screenState.lastIn?.where ? ' · ' + screenState.lastIn.where : ''}`, 16, 11);
    ctx.font = '18px "Microsoft YaHei", sans-serif';
    const inLines = wrapText(ctx, screenState.lastIn?.text || '……', 440).slice(0, 2);
    ctx.fillStyle = '#e4e7f2'; ctx.fillRect(16, 58, 470, inLines.length * 26 + 16);
    ctx.fillStyle = '#4a4a5a'; inLines.forEach((line, i) => ctx.fillText(line, 26, 66 + i * 26));
    const top = 58 + inLines.length * 26 + 30;
    if (s === 'thinking' && !screenState.reply) {
      ctx.fillStyle = '#8a8fa8'; ctx.font = '20px "Microsoft YaHei", sans-serif';
      ctx.fillText('思考中' + '.'.repeat(1 + Math.floor(t * 3) % 3), 26, top);
    } else {
      ctx.fillStyle = '#26263a'; ctx.font = '19px "Microsoft YaHei", sans-serif';
      const lines = wrapText(ctx, screenState.reply + (Math.floor(t * 2.5) % 2 ? '▍' : ' '), 460);
      const rows = Math.floor((h - top - 6) / 26);
      lines.slice(-rows).forEach((line, i) => ctx.fillText(line, 26, top + i * 26));
    }
    screenGlow.intensity = 0.9;
  } else if (s === 'working') {
    ctx.fillStyle = '#1e1f2e'; ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#2a2c40'; ctx.fillRect(0, 0, w, 36);
    ctx.fillStyle = '#e57f4f'; ctx.fillRect(12, 8, 150, 28);
    ctx.fillStyle = '#fff'; ctx.font = '600 16px "Microsoft YaHei", sans-serif';
    ctx.fillText(screenState.work ? 'memory.md' : '任务', 24, 13);
    ctx.fillStyle = '#c9cbe0'; ctx.font = '15px Consolas, "Microsoft YaHei", monospace';
    ctx.fillText(room.detail.slice(0, 30), 180, 12);
    if (screenState.work) {
      ctx.fillStyle = '#d8dbf0'; ctx.font = '17px Consolas, "Microsoft YaHei", monospace';
      const lines = wrapText(ctx, screenState.work + (Math.floor(t * 2.5) % 2 ? '▍' : ''), 470);
      lines.slice(-10).forEach((line, i) => ctx.fillText(line, 18, 50 + i * 26));
    } else {
      const scroll = Math.floor(t * 4);
      const palette = ['#8ea2ff', '#e57f4f', '#7cbf8e', '#f2b84b', '#c9cbe0'];
      for (let i = 0; i < 10; i++) {
        let x = 18 + ((i + scroll) * 37 % 5) * 18, n = i + scroll;
        for (let j = 0; j < 3 + (n * 7 % 4); j++) { const len = 20 + (n * 13 + j * 29) % 90; ctx.fillStyle = palette[(n + j) % 5]; ctx.fillRect(x, 54 + i * 26, len, 12); x += len + 10; }
      }
    }
    screenGlow.intensity = 0.8;
  }
  screen.tex.needsUpdate = true;
}

// ------------------------------------------------------------------ 头顶气泡
const bubble = (() => {
  const el = $('bubble'); let until = 0, lock = 0;
  return {
    say(html, ms = 0, isHtml = false) { if (isHtml) el.innerHTML = html; else el.textContent = html; el.classList.remove('hidden'); until = ms ? performance.now() + ms : 0; },
    dots() { el.innerHTML = '<span class="dots"><i></i><i></i><i></i></span>'; el.classList.remove('hidden'); until = 0; },
    hide() { el.classList.add('hidden'); until = 0; },
    hold(ms) { lock = performance.now() + ms; },
    locked() { return performance.now() < lock; },
    tick() {
      if (until && performance.now() > until) this.hide();
      const p = anchor(0, 1.02).add(V(0, 0.12, 0)).project(camera);
      el.style.left = `${(p.x + 1) / 2 * innerWidth}px`; el.style.top = `${(1 - p.y) / 2 * innerHeight}px`;
    },
  };
})();
const tail = (text, n) => (text.length > n ? '…' + text.slice(-n) : text);

// ------------------------------------------------------------------ 房间状态（来自服务端）
const room = { state: 'idle', detail: '在房间里闲逛', since: Date.now() / 1000, source: 'room', stats: null, hasKey: false, model: '' };
function setRoomState(ev, initial = false) {
  const prev = room.state;
  Object.assign(room, { state: ev.state, detail: ev.detail || STATES[ev.state]?.label || '', since: ev.since || Date.now() / 1000, source: ev.source || '' });
  const info = STATES[room.state] || STATES.idle;
  $('chip').style.setProperty('--state', info.color); $('chipText').textContent = info.label;
  $('detail').textContent = room.detail; $('source').textContent = SOURCES[room.source] ? `来自：${SOURCES[room.source]}` : '';
  if (W.action && !W.action.def.keep) endAction();
  if (prev === 'resting' && room.state !== 'resting' && !initial) act('wake');
  if (room.state === 'idle' && (prev !== 'idle' || initial)) W.idleSince = clock.elapsedTime;
  const target = spotFor(room.state, room.detail);
  if (W.held || W.fallV !== null) { /* 放下后 resume() 会去该去的地方 */ }
  else if (target) goTo(target);
  else if (room.state === 'idle' && (prev !== 'idle' || initial)) goTo(initial ? 'rug' : pick(['rug', 'beanbag', 'window']));
  if (room.state === 'thinking') { if (prev !== 'thinking') screenState.reply = ''; bubble.dots(); }
  else if (room.state === 'working') { if (prev !== 'working') screenState.work = ''; bubble.say(`🛠️ ${room.detail}`); }
  else if (room.state === 'resting') { bubble.say('呼……', 1800); }
  else if (room.state === 'error') { bubble.say(`💫 ${room.detail}`, 5000); }
  else if (room.state === 'replying') { if (!screenState.reply) bubble.dots(); }
  else if (room.state === 'idle' && !bubble.locked()) bubble.hide();
}

function feedItem(ev) {
  const li = document.createElement('li'); li.className = ev.type;
  const time = document.createElement('time'); time.textContent = hhmm(ev.ts || Date.now() / 1000);
  const txt = document.createElement('div'); txt.className = 'txt';
  if (ev.type === 'state') {
    const info = STATES[ev.state] || STATES.idle;
    const dot = document.createElement('span'); dot.className = 'dot'; dot.style.background = info.color;
    txt.append(dot, `${info.label}：${ev.detail || ''}`);
  } else if (ev.type === 'msg_in') {
    const b = document.createElement('b'); b.textContent = `📩 ${ev.who}${ev.where ? '（' + ev.where + '）' : ''}`;
    txt.append(b, `：${ev.text}`);
  } else if (ev.type === 'msg_out') {
    const b = document.createElement('b'); b.textContent = `💬 回复${ev.who ? ' ' + ev.who : ''}`;
    txt.append(b, `：${ev.text.length > 120 ? ev.text.slice(0, 120) + '…' : ev.text}`);
  } else txt.textContent = `· ${ev.text}`;
  li.append(time, txt); return li;
}
function addFeed(ev) {
  const list = $('feed'); list.prepend(feedItem(ev));
  while (list.children.length > 80) list.lastChild.remove();
}
function renderStats() {
  const s = room.stats; if (!s) return;
  $('stats').textContent = `今天 收到 ${s.msg_in} · 回复 ${s.replies} · 干活 ${s.works}　|　${room.hasKey ? room.model : '未配置 DeepSeek Key（演示模式）'}`;
}

function handle(ev) {
  switch (ev.type) {
    case 'hello':
      $('feed').innerHTML = ''; ev.feed.forEach(addFeed);
      room.stats = ev.stats; room.hasKey = ev.has_key; room.model = ev.model; renderStats();
      setRoomState(ev.state, true); break;
    case 'state': addFeed(ev); setRoomState(ev); break;
    case 'msg_in':
      addFeed(ev); screenState.lastIn = ev; screenState.reply = '';
      envelope(WINDOW_OUT.clone(), anchor(0, 0.5).addScaledVector(TOWARD, 0.3), () => spawnBubble());
      if (!W.held && W.fallV === null) act('alert'); break;
    case 'chunk':
      screenState.reply += ev.text; bubble.say(tail(screenState.reply, 90)); break;
    case 'work_chunk':
      screenState.work += ev.text; break;
    case 'msg_out':
      addFeed(ev); screenState.reply = ev.text;
      bubble.say(ev.text.length > 140 ? ev.text.slice(0, 140) + '…' : ev.text, 7000); bubble.hold(7000);
      spout(); setTimeout(() => envelope(anchor(0, 0.5).addScaledVector(TOWARD, 0.3), WINDOW_OUT.clone()), 500);
      if (!W.held && W.fallV === null) act('celebrate'); break;
    case 'log': addFeed(ev); break;
    case 'stats': room.stats = ev.stats; renderStats(); break;
  }
}

// ------------------------------------------------------------------ 连接服务端
const banner = $('banner');
function connect() {
  if (location.protocol === 'file:') {
    banner.textContent = '直接打开文件看不到它在干什么：请双击「启动小房间.bat」'; banner.classList.remove('hidden');
    $('conn').textContent = '未连接'; setRoomState({ state: 'idle', detail: '在房间里闲逛' }, true); return;
  }
  const es = new EventSource('/api/stream');
  es.onopen = () => { banner.classList.add('hidden'); $('conn').textContent = '● 实时'; };
  es.onmessage = (m) => { try { handle(JSON.parse(m.data)); } catch (e) { console.error(e); } };
  es.onerror = () => { $('conn').textContent = '重连中…'; banner.textContent = '和小房间断开了，正在重连…（服务关了的话重新运行 启动小房间.bat）'; banner.classList.remove('hidden'); };
}
connect();

async function post(path, body) {
  const res = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}
$('chat').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = $('msg'), text = input.value.trim(); if (!text) return;
  input.value = ''; $('send').disabled = true;
  try { const r = await post('/api/chat', { message: text }); if (!r.ok && r.error) addFeed({ type: 'log', text: r.error, ts: Date.now() / 1000 }); }
  catch { addFeed({ type: 'log', text: '发不出去：小房间的服务没开', ts: Date.now() / 1000 }); }
  finally { $('send').disabled = false; input.focus(); }
});

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
document.querySelectorAll('[data-demo]').forEach((btn) => btn.addEventListener('click', async () => {
  const kind = btn.dataset.demo, ev = (body) => post('/api/event', { source: 'demo', ...body });
  if (kind === 'working') return ev({ type: 'state', state: 'working', detail: '在用工具 get_hot_topics 查热榜' });
  if (kind === 'resting') return ev({ type: 'state', state: 'resting', detail: '演示：在床上打个盹' });
  if (kind === 'idle') return ev({ type: 'state', state: 'idle', detail: '在房间里闲逛' });
  if (kind === 'error') return ev({ type: 'state', state: 'error', detail: '演示：DeepSeek 返回 500，没回上' });
  if (kind === 'qq') {
    await ev({ type: 'msg_in', who: '群友小王', where: 'QQ 群', text: '大肥鱼你今天都干啥了' });
    await sleep(1600);
    await ev({ type: 'state', state: 'replying', detail: '在回复 群友小王' });
    const reply = '今天上午帮主人查了热榜，下午在床上睡了一觉，现在刚醒，正在书桌前回你消息呢～';
    for (let i = 0; i < reply.length; i += 3) { await ev({ type: 'chunk', text: reply.slice(i, i + 3) }); await sleep(70); }
    await ev({ type: 'msg_out', who: '群友小王', text: reply });
  }
}));

// ------------------------------------------------------------------ 摸头、戳一下、拎起来（参考 VPet / Shimeji）
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const holdPlane = new THREE.Plane(new V3(0, 1, 0), -3.0), holdPoint = new V3();
const canvasEl = $('scene');
let drag = null;
function aim(e) {
  ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  raycaster.setFromCamera(ndc, camera);
}
function groundAt(pos) {
  if (pos.x < -3.05 && pos.z > 0.6 && pos.z < 3.45) return 0.65;   // 放在床上就站在床上
  return 0;
}
function pickUp() {
  endAction(); W.path = []; W.held = true; W.fallV = null; W.arrived = true; W.spot = 'free';
  bubble.say(pick(['哇！放我下来～', '要飞起来了！', '别晃别晃']), 2000); bubble.hold(1200);
  localLog('你把大肥鱼拎了起来');
}
function clickChar(part) {
  const sleeping = room.state === 'resting' && W.spot === 'bed' && W.arrived;
  if (sleeping) { for (let i = 0; i < 2; i++) setTimeout(spawnHeart, i * 160); bubble.say(part === 'head' ? '嗯……（蹭了蹭）' : '嗯……（翻了个身）', 2000); return; }
  act(part === 'head' ? 'pet' : 'poke');
}
canvasEl.addEventListener('pointerdown', (e) => {
  aim(e); const part = hitChar(raycaster); if (!part) return;
  drag = { x: e.clientX, y: e.clientY, lastX: e.clientX, moved: false, part };
  try { canvasEl.setPointerCapture(e.pointerId); } catch {}
  canvasEl.style.cursor = 'grabbing';
});
canvasEl.addEventListener('pointermove', (e) => {
  aim(e);
  if (!drag) { canvasEl.style.cursor = hitChar(raycaster) ? 'grab' : 'default'; return; }
  if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 8) { drag.moved = true; pickUp(); }
  if (drag.moved && raycaster.ray.intersectPlane(holdPlane, holdPoint)) {
    const x = Math.min(4.3, Math.max(-4.3, holdPoint.x)), z = Math.min(4.3, Math.max(-4.3, holdPoint.z));
    W.groundY = groundAt(V(x, 0, z));
    W.pos.set(x, Math.max(W.groundY + 0.35, 3.0 - 2.35), z);
    W.swingTarget = Math.min(0.7, Math.max(-0.7, -(e.clientX - drag.lastX) * 0.03)); drag.lastX = e.clientX;
  }
});
function release(e) {
  if (!drag) return;
  try { canvasEl.releasePointerCapture(e.pointerId); } catch {}
  if (drag.moved) { W.held = false; W.fallV = 0; }
  else clickChar(drag.part);
  drag = null; canvasEl.style.cursor = 'grab';
}
canvasEl.addEventListener('pointerup', release);
canvasEl.addEventListener('pointercancel', release);

document.querySelectorAll('[data-play]').forEach((btn) => btn.addEventListener('click', () => {
  const kind = btn.dataset.play;
  if (kind === 'snack') return dropSnack();
  if (room.state !== 'idle') return bubble.say(room.state === 'resting' ? '（睡得正香）' : '等我忙完～', 1500);
  if (W.held || W.fallV !== null) return;
  W.path = []; W.arrived = true; W.spot = 'free'; act(kind);
}));

// ------------------------------------------------------------------ 主循环
const realClock = new THREE.Clock(), clock = { elapsedTime: 0 };   // clock 是动画时间，可以手动快进
let lastScreen = 0, lastClock = -1, lastZ = 0, lastBubble = 0, lastSky = -1;
function step(dt) {
  clock.elapsedTime += dt; const t = clock.elapsedTime;
  updateChar(dt, t); updateParticles(dt); bubble.tick();
  const target = lightTargets(), k = 1 - Math.exp(-dt * 2);
  for (const key of Object.keys(light)) light[key] += (target[key] - light[key]) * k;
  sun.intensity = light.sun; hemi.intensity = light.hemi; lampLight.intensity = light.lamp;
  shadeMat.emissiveIntensity = light.lamp / 3;
  fairy.forEach((b, i) => b.material.color.setHSL(0.11, 0.8, 0.55 + light.fairy * (0.25 + 0.12 * Math.sin(t * 2 + i))));
  if (t - lastScreen > 0.1) { drawScreen(t); lastScreen = t; }
  const sec = new Date().getSeconds();
  if (sec !== lastClock) {
    drawClock(); lastClock = sec;
    $('clock').textContent = new Date().toTimeString().slice(0, 5);
    const mins = Math.floor((Date.now() / 1000 - room.since) / 60);
    $('since').textContent = mins < 1 ? '刚刚开始' : mins < 60 ? `已经 ${mins} 分钟` : `已经 ${Math.floor(mins / 60)} 小时 ${mins % 60} 分`;
    const minute = new Date().getMinutes();
    if (minute !== lastSky) { drawSky(); applyDayClass(); lastSky = minute; }
  }
  if (room.state === 'resting' && W.arrived && W.spot === 'bed' && t - lastZ > 1.1) { spawnZ(); lastZ = t; }
  if (room.state === 'idle' && W.arrived && t - lastBubble > 4.5) { if (Math.random() < 0.5) spawnBubble(); lastBubble = t; }
}
function frame() {
  step(Math.min(realClock.getDelta(), 0.05));
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
drawSky(); drawClock(); applyDayClass();
if (location.search.includes('debug')) window.__room = { THREE, renderer, scene, camera, char, W, goTo, SPOTS, room, resize, act, dropSnack,
  run(sec) { for (let i = 0; i < sec * 30; i++) step(1 / 30); renderer.render(scene, camera); },
  look(x, y, z, zoom) { camera.zoom = zoom; camera.position.set(x + 13, y + 11.5, z + 13); camera.lookAt(x, y, z); camera.updateProjectionMatrix(); renderer.render(scene, camera); } };
requestAnimationFrame(frame);
</script>
</body>
